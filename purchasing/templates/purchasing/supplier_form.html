{% extends "base.html" %}
{% block title %}{{ title }} · Loyal Green{% endblock %}
{% block content %}
<p class="small"><a href="{% if supplier %}{{ supplier.get_absolute_url }}{% else %}{% url 'supplier_list' %}{% endif %}">← Back</a></p>
<h1>{{ title }}</h1>
<form method="post" class="card form-grid">
  {% csrf_token %}
  {% for error in form.non_field_errors %}<div class="msg msg-error">{{ error }}</div>{% endfor %}
  {% for field in form %}{% include "_field.html" %}{% endfor %}
  <div class="form-actions"><button type="submit" class="primary">Save</button></div>
</form>
{% endblock %}
